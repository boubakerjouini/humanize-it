<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter', sans-serif; background: #0f0f23; }
.card {
  width: 1200px; height: 630px;
  background: linear-gradient(160deg, #0f0f23 0%, #150d2a 50%, #0d1117 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 44px 60px;
}
.bg-glow {
  position: absolute;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(124,58,237,0.2) 0%, transparent 70%);
  top: -100px; left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 50px 50px;
}
.header {
  position: relative; z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900; color: white;
}
.logo-text {
  font-size: 17px; font-weight: 700; color: #fff;
}
.logo-text span { color: #a78bfa; }
.title-block {
  text-align: center;
}
.title-label {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: #8b5cf6; text-transform: uppercase;
  margin-bottom: 6px;
}
.title {
  font-size: 42px; font-weight: 800;
  color: #fff; letter-spacing: -1.5px;
}
.title em {
  font-style: normal;
  background: linear-gradient(135deg, #a78bfa, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.spacer { width: 130px; }
.team-grid {
  display: flex;
  gap: 16px;
  position: relative; z-index: 10;
  flex: 1;
}
.member-card {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.member-card.ai {
  border-color: rgba(124,58,237,0.3);
  background: rgba(124,58,237,0.06);
}
.member-card.human {
  border-color: rgba(251,191,36,0.3);
  background: rgba(251,191,36,0.05);
}
.member-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(124,58,237,0.8), transparent);
}
.member-card.human::before {
  background: linear-gradient(90deg, transparent, rgba(251,191,36,0.8), transparent);
}
.avatar {
  font-size: 38px;
  margin-bottom: 12px;
  line-height: 1;
}
.member-name {
  font-size: 18px; font-weight: 700;
  color: #fff; letter-spacing: -0.5px;
  margin-bottom: 5px;
}
.member-role {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
  line-height: 1.4;
}
.member-model {
  font-size: 11px; font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  font-family: 'Inter', monospace;
  letter-spacing: 0.3px;
}
.member-card.ai .member-model {
  background: rgba(124,58,237,0.2);
  color: #c4b5fd;
  border: 1px solid rgba(124,58,237,0.4);
}
.member-card.human .member-model {
  background: rgba(251,191,36,0.15);
  color: #fbbf24;
  border: 1px solid rgba(251,191,36,0.35);
}
.footer {
  position: relative; z-index: 10;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.footer-text {
  font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.5px;
}
.anthropic-badge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.5);
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-glow"></div>
  <div class="grid-overlay"></div>
  
  <div class="header">
    <div class="logo">
      <div class="logo-icon">H</div>
      <span class="logo-text">Humanize<span>It</span></span>
    </div>
    <div class="title-block">
      <div class="title-label">Our team</div>
      <div class="title">Meet the <em>team</em></div>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="team-grid">
    <div class="member-card ai">
      <div class="avatar">🤖</div>
      <div class="member-name">Claude</div>
      <div class="member-role">CTO &amp; Lead Developer</div>
      <div class="member-model">claude-sonnet-4-5</div>
    </div>
    <div class="member-card ai">
      <div class="avatar">🤖</div>
      <div class="member-name">Claude</div>
      <div class="member-role">CMO &amp; Content Strategist</div>
      <div class="member-model">claude-sonnet-4-5</div>
    </div>
    <div class="member-card ai">
      <div class="avatar">🤖</div>
      <div class="member-name">Claude</div>
      <div class="member-role">COO &amp; Operations</div>
      <div class="member-model">claude-sonnet-4-5</div>
    </div>
    <div class="member-card human">
      <div class="avatar">👨‍💼</div>
      <div class="member-name">Bouba</div>
      <div class="member-role">CEO &amp; Founder</div>
      <div class="member-model">Human (pays the bills)</div>
    </div>
  </div>

  <div class="footer">
    <div class="anthropic-badge">⚡ Powered by Anthropic</div>
    <div class="footer-text">· A 100% AI-built SaaS ·</div>
  </div>
</div>
</body>
</html>
