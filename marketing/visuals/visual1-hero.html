<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
.card {
  width: 1200px; height: 630px;
  background: linear-gradient(135deg, #0f0f23 0%, #1a0a2e 40%, #0f0f23 100%);
  position: relative;
  overflow: hidden;
}
.bg-glow {
  position: absolute;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(124,58,237,0.28) 0%, transparent 70%);
  top: -150px; right: -100px;
}
.bg-glow2 {
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(79,70,229,0.18) 0%, transparent 70%);
  bottom: -60px; left: -60px;
}
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}
/* LOGO ROW — absolute at top */
.logo-row {
  position: absolute;
  top: 38px; left: 60px; right: 60px;
  display: flex; align-items: center; gap: 10px;
  z-index: 10;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; color: white;
  flex-shrink: 0;
}
.logo-text { font-size: 17px; font-weight: 700; color: #fff; }
.logo-text span { color: #a78bfa; }
.badge {
  margin-left: auto;
  background: rgba(124,58,237,0.15);
  border: 1px solid rgba(124,58,237,0.45);
  color: #c4b5fd;
  font-size: 11px; font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
}
/* CONTENT — absolute in middle */
.content {
  position: absolute;
  top: 120px; left: 60px; right: 60px;
  z-index: 10;
}
.label {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: #8b5cf6;
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.label::before {
  content: '';
  display: inline-block;
  width: 24px; height: 2px;
  background: linear-gradient(90deg, #7c3aed, #a78bfa);
  border-radius: 2px;
  flex-shrink: 0;
}
.headline {
  font-size: 52px; font-weight: 800;
  color: #ffffff;
  line-height: 1.08;
  letter-spacing: -2px;
  max-width: 860px;
  margin-bottom: 20px;
}
.headline em {
  font-style: normal;
  background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-size: 19px; font-weight: 400;
  color: rgba(255,255,255,0.50);
  line-height: 1.5;
  max-width: 580px;
}
/* STATS — absolute at bottom */
.stats {
  position: absolute;
  bottom: 36px; left: 60px; right: 60px;
  display: flex;
  gap: 0;
  z-index: 10;
  border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 22px;
}
.stat {
  flex: 1;
  padding-right: 28px;
  border-right: 1px solid rgba(255,255,255,0.07);
  margin-right: 28px;
}
.stat:last-child { border-right: none; margin-right: 0; }
.stat-value {
  font-size: 34px; font-weight: 800;
  color: #fff; letter-spacing: -1.5px;
  margin-bottom: 4px;
}
.stat-value.purple { color: #a78bfa; }
.stat-value.green { color: #34d399; }
.stat-label {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>
  <div class="grid-overlay"></div>

  <div class="logo-row">
    <div class="logo-icon">H</div>
    <span class="logo-text">Humanize<span>It</span></span>
    <div class="badge">🤖 AI-Built SaaS</div>
  </div>

  <div class="content">
    <div class="label">The experiment</div>
    <div class="headline">I gave <em>Claude</em> API keys.<br>It built me a SaaS in 7 days.</div>
    <div class="subtitle">No developers. No designers. No co-founders. Just Claude.</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value purple">7</div>
      <div class="stat-label">Days to build</div>
    </div>
    <div class="stat">
      <div class="stat-value green">$0</div>
      <div class="stat-label">Dev cost</div>
    </div>
    <div class="stat">
      <div class="stat-value purple">100%</div>
      <div class="stat-label">AI-built</div>
    </div>
    <div class="stat">
      <div class="stat-value">∞</div>
      <div class="stat-label">Lessons learned</div>
    </div>
  </div>
</div>
</body>
</html>
